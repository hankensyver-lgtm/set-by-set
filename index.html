<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Plan workouts from your equipment, target muscles, time and intensity, then train with tap-to-cross-off sets and automatic timers.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Set by Set">
<meta name="theme-color" content="#eceff3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1217" media="(prefers-color-scheme: dark)">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Set by Set</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one mobile-first column; setup → plan → train, with a fixed bottom dock / timer sheet. Intensity uses bumper-plate colours. */
:root{
  --bg:#eceff3; --surface:#fbfcfd; --sunken:#e1e6ec; --ink:#121821; --muted:#5a6676; --line:#d3dae3;
  --accent:#1d5bd8; --accent-ink:#ffffff; --accent-soft:#d6e2fa;
  --p10:#23854a; --p15:#c98d00; --p20:#1d5bd8; --p25:#cf3a2e;
  --shadow:rgba(18,24,33,.14);
  --f-display:'Big Shoulders Display','Arial Narrow','Helvetica Neue',sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1217; --surface:#161c24; --sunken:#1f2630; --ink:#e7ecf2; --muted:#94a1b2; --line:#2a333f;
    --accent:#5b8ef2; --accent-ink:#0a1120; --accent-soft:#1c2a45;
    --p10:#3fb36a; --p15:#f0b92b; --p20:#5b8ef2; --p25:#ef5a4c; --shadow:rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1217; --surface:#161c24; --sunken:#1f2630; --ink:#e7ecf2; --muted:#94a1b2; --line:#2a333f;
  --accent:#5b8ef2; --accent-ink:#0a1120; --accent-soft:#1c2a45;
  --p10:#3fb36a; --p15:#f0b92b; --p20:#5b8ef2; --p25:#ef5a4c; --shadow:rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:680px;margin:0 auto;padding-block:14px 140px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:14px}
.logo{font:800 32px/1 var(--f-display);text-transform:uppercase;letter-spacing:.01em;margin:0}
.logo span{color:var(--accent)}
.logo{display:flex;align-items:center;gap:10px}
.emblem{width:40px;height:40px;flex:none;border-radius:9px}
.steps{display:flex;gap:4px;margin:0;padding:0;list-style:none}
.step{appearance:none;border:1px solid var(--line);background:transparent;color:var(--muted);font:600 12px/1 var(--f-body);text-transform:uppercase;letter-spacing:.08em;padding:8px 11px;border-radius:999px;cursor:pointer}
.step b{font-family:var(--f-mono);margin-right:5px}
.step[aria-current="step"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.step:disabled{cursor:default;opacity:.5}

h2{font:700 24px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
.block{display:grid;gap:12px;padding-block:20px;border-top:1px solid var(--line)}
.bh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:14px}
.link{appearance:none;border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:4px 0;font-size:15px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--surface);font:500 15px/1 var(--f-body);padding:0 14px;min-height:42px;border-radius:10px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.fixed{background:var(--sunken);border-style:dashed;color:var(--muted);cursor:default}

.dur{font:700 40px/1 var(--f-display);font-variant-numeric:tabular-nums}
.dur small{font:600 16px var(--f-body);color:var(--muted);margin-left:4px}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.scale{display:flex;justify-content:space-between;color:var(--muted);font:500 12px var(--f-mono);margin-top:-6px}

.plates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.plate{appearance:none;background:none;border:0;display:grid;justify-items:center;gap:8px;cursor:pointer;padding:6px 0;border-radius:12px}
.disc{width:min(78px,19vw);aspect-ratio:1;max-width:100%;border-radius:50%;border:5px solid var(--pc);background:var(--sunken);display:grid;place-items:center;font:800 22px/1 var(--f-display);color:var(--muted);transition:border-width .15s,transform .15s;opacity:.55}
.plate[aria-pressed="true"] .disc{border-width:14px;opacity:1;color:var(--ink);transform:scale(1.04)}
.pl{font-weight:600;font-size:14px}
.desc{margin:0;color:var(--muted);max-width:60ch}

.toggles{display:grid;gap:8px}
.toggle{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--accent);margin:0}
.toggle span{font-weight:600}
.toggle small{margin-left:auto;color:var(--muted);font-size:14px}

.btn{appearance:none;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font:600 16px/1 var(--f-body);padding:0 18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.wide{width:100%}
.btn.big{min-height:56px;font-size:18px}
.btn.small{min-height:40px;font-size:14px;padding:0 12px}
.btn:disabled{opacity:.5;cursor:default}

.history{display:grid;gap:6px;margin-top:24px}
.history h3,.sect{font:700 12px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.hrow{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.hrow span:last-child{color:var(--muted);text-align:right}

/* plan */
.summary{display:grid;gap:10px;padding-bottom:16px}
.summary .big{font:800 44px/1 var(--f-display);font-variant-numeric:tabular-nums}
.summary .big small{font:600 16px var(--f-body);color:var(--muted)}
.summary .big.over{color:var(--p25)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font:600 12px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:6px 8px;border-radius:6px;background:var(--sunken);color:var(--muted)}
.tag.int{background:transparent;border:2px solid var(--pc);color:var(--ink)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.note{font-size:14px;color:var(--muted);border-left:3px solid var(--p15);padding:4px 10px;margin:0}
.sect{display:flex;justify-content:space-between;padding:18px 2px 8px}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:grid;grid-template-columns:minmax(0,1fr) auto}
.row-main{appearance:none;text-align:left;padding:12px 14px;background:none;border:0;cursor:pointer;min-width:0;display:grid;gap:3px;border-radius:12px}
.name{font-weight:600;font-size:17px;line-height:1.25}
.meta{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.meta b{color:var(--ink);font-weight:600}
.row-actions{display:flex;align-items:center;padding-right:4px}
.icon{appearance:none;width:42px;height:42px;border-radius:10px;border:0;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.icon:hover{background:var(--sunken);color:var(--ink)}
.editor{grid-column:1/-1;border-top:1px dashed var(--line);padding:12px 14px 14px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.field{display:grid;gap:5px}
.field > span{font:600 11px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ctl{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.ctl button{appearance:none;width:40px;height:40px;border:0;background:none;cursor:pointer;font-size:20px;line-height:1}
.ctl button:hover{background:var(--sunken)}
.ctl output{min-width:58px;text-align:center;font:600 15px var(--f-mono)}
.txt{height:42px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:600 15px var(--f-mono);padding:0 10px;width:110px}
.moves{display:flex;gap:4px;margin-left:auto}
.moves .icon{border:1px solid var(--line)}
.addbar{display:flex;gap:8px;margin-top:10px}
.addbar select{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:500 15px var(--f-body);padding:0 10px}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dock-in{max-width:680px;margin:0 auto;display:flex;gap:10px}
.dock-in .btn.primary{flex:1}

/* train */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:8px 10px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.clock{font:700 28px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.clock-l{font:600 11px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
.prog{flex:1;min-width:60px;display:grid;gap:5px}
.prog small{font:600 13px var(--f-mono);color:var(--muted);text-align:right}
.track{height:6px;border-radius:99px;background:var(--sunken);overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);transition:width .3s}

.now{background:var(--ink);color:var(--bg);border-radius:16px;padding:18px;display:grid;gap:12px;margin-bottom:18px}
.eyebrow{font:600 12px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.now .nname{font:800 34px/1 var(--f-display);text-transform:uppercase;letter-spacing:.01em;margin:0;text-wrap:balance}
.now .cue{margin:0;opacity:.8}
.now .target{font:700 20px/1.2 var(--f-mono);font-variant-numeric:tabular-nums}
.now .row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.now .btn.primary{flex:1;min-width:180px}
.now .btn.ghost{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,transparent)}
.wt{display:flex;align-items:center;gap:6px;font:600 14px var(--f-body)}
.wt input{width:84px;height:44px;border-radius:10px;border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);background:transparent;color:var(--bg);font:700 16px var(--f-mono);padding:0 10px;color-scheme:inherit}

.exlist{display:grid;gap:8px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:10px}
.ex.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.ex.fin .name{text-decoration:line-through;text-decoration-color:var(--p25);text-decoration-thickness:2px;color:var(--muted)}
.ex-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ex-h .meta{white-space:nowrap}
.setchips{display:flex;flex-wrap:wrap;gap:6px}
.set{appearance:none;position:relative;min-width:58px;height:44px;padding:0 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font:600 14px var(--f-mono);cursor:pointer;font-variant-numeric:tabular-nums}
.set.cur{border-color:var(--accent)}
.set.done{color:var(--muted);background:var(--sunken)}
.set.done::after{content:"";position:absolute;left:7px;right:7px;top:50%;height:3px;border-radius:2px;background:var(--p25);transform:rotate(-18deg)}
.set.skip{color:var(--muted);border-style:dashed}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:3px solid var(--tc);box-shadow:0 -10px 30px var(--shadow);padding-top:14px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-in{max-width:680px;margin:0 auto;display:grid;gap:10px}
.sh-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.kind{font:700 13px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--tc)}
.sh-next{color:var(--muted);font-size:14px;min-width:0}
.tbig{font:700 72px/1 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tline{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.side{font:700 16px var(--f-body);color:var(--tc)}
.bar{height:8px;background:var(--sunken);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--tc)}
.sh-btns{display:flex;gap:8px}
.sh-btns .btn{flex:1}

/* done */
.done-h{display:grid;gap:6px;padding-block:8px 18px}
.huge{font:800 52px/0.95 var(--f-display);text-transform:uppercase;margin:0}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:6px}
.stat b{font:800 34px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font:600 12px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stack{display:grid;gap:10px;margin-top:18px}

.mchip{display:inline-flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;padding-block:7px;text-align:left}
.mchip small{font-size:12px;opacity:.7}
.explain{margin:0;font-size:14px;color:var(--muted);max-width:65ch}
.explain b{color:var(--ink);font-weight:600}
.explain svg{vertical-align:-2px}
.how{font-size:14px;color:var(--muted);line-height:1.4;margin-top:3px}
.how b{color:var(--ink);font-weight:600}
.how.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.now .cue b{font-weight:700}
.howto summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;padding:2px 0}
.howto p{margin:6px 0 0;font-size:14px;color:var(--muted)}
.howto p b{color:var(--ink)}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:20;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 20px var(--shadow)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:420px){ .tbig{font-size:60px} .now .nname{font-size:28px} .huge{font-size:42px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="app">
  <header class="brand">
    <h1 class="logo"><svg class="emblem" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#121821"/><circle cx="256" cy="256" r="200" fill="#1d5bd8"/><g fill="#fff" transform="translate(256 256) rotate(-35) scale(.86)"><rect x="-110" y="-17" width="220" height="34" rx="10"/><rect x="-140" y="-80" width="44" height="160" rx="14"/><rect x="96" y="-80" width="44" height="160" rx="14"/><rect x="-183" y="-56" width="34" height="112" rx="12"/><rect x="149" y="-56" width="34" height="112" rx="12"/></g></svg>Set <span>by</span> Set</h1>
    <ol class="steps" id="steps"></ol>
  </header>
  <main id="view"></main>
</div>
<div id="dock"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* ---------- data ---------- */
const EQUIP=[['db','Dumbbells'],['kb','Kettlebell'],['bb','Barbell + rack'],['bench','Bench'],['bar','Pull-up bar'],['band','Resistance bands'],['cable','Cable machine'],['machine','Weight machines'],['cardio','Rower / bike'],['rope','Jump rope']];

['pulldown','Lat pulldown','back biceps','cable|machine','c','Pull to upper chest, lean back slightly'],

['shouldermachine','Shoulder press machine','shoulders triceps','machine','c','Seat so handles start at shoulder height'],
['dbcurl','Dumbbell curl','biceps','db','i','Elbows pinned, no swing'],
['hammer','Hammer curl','biceps','db|kb','i','Neutral grip, slow lowering'],
['bbcurl','Barbell curl','biceps','bb','i','Elbows still, full extension'],
['bandcurl','Band curl','biceps','band|cable','i','Stand on the band, squeeze at the top'],
['towelcurl','Isometric towel curl','biceps','','t','Stand on a towel, pull up hard'],

const $=s=>document.querySelector(s);
const rnd5=x=>Math.max(0,Math.round(x/5)*5);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const uid=()=>Math.random().toString(36).slice(2,9);
const fmt=s=>{s=Math.max(0,Math.ceil(s));const m=Math.floor(s/60),r=s%60;return m+':'+String(r).padStart(2,'0');};
const fmtLong=ms=>{const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(r).padStart(2,'0');};
function parseReps(str){const n=String(str).match(/\d+/g);if(!n)return 15;const a=n.slice(0,2).map(Number);return Math.round(a.reduce((x,y)=>x+y,0)/a.length);}
let toastT; function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2400);}

function pickAlt(e,have){if(!e.eq)return [];for(const a of e.eq.split('|')){const p=a.split('+');if(p.every(k=>have.has(k)))return p;}return null;}
function availFor(equip){const have=new Set(equip);return EX.map(e=>({e,alt:pickAlt(e,have)})).filter(x=>x.alt);}

function makeItem(e,alt,I){
  const it={uid:uid(),id:e.id,name:e.name,m:e.m,kind:e.kind,side:e.side,cue:e.cue,section:'main',
    eq:alt.length?alt.map(k=>EQ_SHORT[k]).join(' + '):'Bodyweight',mode:'reps',sets:I.sets,reps:I.reps,work:0,rest:I.rest};
  if(e.kind==='i'){it.sets=Math.min(4,I.sets);it.reps=I.iso;it.rest=Math.max(30,rnd5(I.rest*.6));}
  if(e.kind==='b'){it.sets=Math.min(4,I.sets);it.reps=I.bw;it.rest=rnd5(I.rest*.75);}
  if(e.kind==='t'){it.mode='time';it.sets=Math.max(2,Math.min(4,I.sets));it.work=I.hold;it.rest=Math.max(20,rnd5(I.rest*.6));}
  if(e.kind==='k'){it.mode='time';it.sets=I.rounds;it.work=I.kWork;it.rest=I.kRest;}
  it.repsN=parseReps(it.reps);
  return it;
}
function workSec(it){return it.mode==='time'?it.work*(it.side?2:1):Math.round((it.repsN||12)*3.5*(it.side?2:1));}
function est(it){return it.sets*(workSec(it)+it.rest)+(it.section==='main'?30:5);}
const sumEst=a=>a.reduce((s,it)=>s+est(it),0);

function region(muscles){const up=['chest','back','shoulders','biceps','triceps'].some(m=>muscles.includes(m));const lo=['quads','hamstrings','glutes','calves'].some(m=>muscles.includes(m));return {up,lo};}
function buildWarm(inp){
  const {up,lo}=region(inp.muscles);const n=inp.minutes<25?3:inp.minutes<45?4:5;
  let pool=WARM.filter(w=>w[3]==='all'||(w[3]==='upper'&&(up||!lo))||(w[3]==='lower'&&(lo||!up)));
  if(!inp.equip.includes('band'))pool=pool.filter(w=>w[0]!=='Band dislocates');
  const first=pool.filter(w=>w[0]==='Jumping jacks');const rest=shuffle(pool.filter(w=>w[0]!=='Jumping jacks'));
  let picks=[...first,...rest].slice(0,n);
  const out=picks.map(w=>({uid:uid(),id:'w'+w[0],name:w[0],m:[],kind:'t',side:!!w[4],cue:w[2],eq:'Bodyweight',section:'warm',mode:'time',sets:1,work:w[1],rest:10,reps:'',repsN:0}));
  if(inp.equip.includes('cardio'))out.splice(0,1,{uid:uid(),id:'wcardio',name:'Easy rower or bike',m:[],kind:'k',side:false,cue:'Conversational pace, build slowly',eq:'Rower / bike',section:'warm',mode:'time',sets:1,work:180,rest:20,reps:'',repsN:0});
  return out;
}
function buildCool(inp){
  const n=inp.minutes<30?2:inp.minutes<60?3:4;
  const hit=shuffle(COOL.filter(c=>c[2].split(' ').some(m=>inp.muscles.includes(m))));
  const other=COOL.filter(c=>!hit.includes(c));
  const picks=[...hit,...other.filter(c=>c[0]==="Child's pose"),...other].filter((c,i,a)=>a.indexOf(c)===i).slice(0,n);
  return picks.map(c=>({uid:uid(),id:'c'+c[0],name:c[0],m:[],kind:'t',side:!!c[4],cue:c[3],eq:'Bodyweight',section:'cool',mode:'time',sets:1,work:c[1],rest:10,reps:'',repsN:0}));
}
function score(e,m){if(m==='cardio')return e.kind==='k'?0:1;return {c:0,b:1,t:2,i:2,k:3}[e.kind];}
function generate(inp){
  const I=INT[inp.intensity];const av=availFor(inp.equip);const notes=[];
  const warm=inp.warm?buildWarm(inp):[];const cool=inp.cool?buildCool(inp):[];
  let remaining=inp.minutes*60-sumEst(warm)-sumEst(cool);
  const queues=inp.muscles.map(m=>{
    const prim=av.filter(x=>x.e.m[0]===m),sec=av.filter(x=>x.e.m[0]!==m&&x.e.m.includes(m));
    if(!prim.length&&!sec.length)notes.push(`No ${MNAME[m].toLowerCase()} exercises match your equipment.`);
    const ord=a=>a.map(x=>({x,r:score(x.e,m)+Math.random()*.9})).sort((a,b)=>a.r-b.r).map(o=>o.x);
    return [...ord(prim),...ord(sec)];
  });
  const used=new Set(),main=[];let added=true;
  while(added){added=false;
    for(const q of queues){
      const idx=q.findIndex(x=>!used.has(x.e.id)&&est(makeItem(x.e,x.alt,I))<=remaining);
      if(idx<0)continue;
      const x=q.splice(idx,1)[0];const it=makeItem(x.e,x.alt,I);main.push(it);used.add(x.e.id);remaining-=est(it);added=true;
    }
  }
  if(!main.length){const q=queues.find(q=>q.length);if(q){const it=makeItem(q[0].e,q[0].alt,I);it.sets=2;main.push(it);}}
  for(let p=0;p<2;p++)for(const it of main){const c=workSec(it)+it.rest;if(it.sets<6&&c<=remaining){it.sets++;remaining-=c;}}
  const onlyCardio=inp.muscles.every(m=>m==='cardio');
  const rank=it=>onlyCardio?0:({c:0,b:0,t:1,i:1,k:2}[it.kind]);
  main.sort((a,b)=>rank(a)-rank(b));
  return {items:[...warm,...main,...cool],notes,input:JSON.parse(JSON.stringify(inp))};
}

function dose(it){
  const side=it.side?' / side':'';
  if(it.section!=='main')return `<b>${fmt(it.work)}</b>${side}`;
  return it.mode==='time'?`<b>${it.sets} × ${it.work} s</b>${side}`:`<b>${it.sets} × ${it.reps}</b>${side}`;
}

/* ---------- views ---------- */

}

function vSetup(){

function vPlan(){
  const P=S.plan,inp=P.input,I=INT[inp.intensity];
  const mins=Math.round(sumEst(P.items)/60),over=mins>inp.minutes+3;
  const sec=(key,label)=>{
    const idx=P.items.map((it,i)=>[it,i]).filter(([it])=>it.section===key);
    if(!idx.length)return '';
    const m=Math.round(sumEst(idx.map(x=>x[0]))/60);
    return `<div class="sect"><span>${label}</span><span>≈ ${m} min</span></div><ol class="list">${idx.map(([it,i])=>row(it,i)).join('')}</ol>`;
  };
  const av=availFor(inp.equip),inPlan=new Set(P.items.map(i=>i.id));
  const opts=MUSCLES.map(([k,l])=>{const xs=av.filter(x=>x.e.m[0]===k&&!inPlan.has(x.e.id));return xs.length?`<optgroup label="${l}">${xs.map(x=>`<option value="${x.e.id}">${x.e.name}</option>`).join('')}</optgroup>`:'';}).join('');
  return `
  <section class="summary">
    <div class="tags">${inp.muscles.map(m=>`<span class="tag">${MNAME[m]}</span>`).join('')}<span class="tag int" style="--pc:var(--p${I.plate})">${I.name}</span></div>
    <div class="big ${over?'over':''}">≈ ${mins} <small>of ${inp.minutes} min planned</small></div>

  </section>

function row(it,i){
  const open=S.open===it.uid,main=it.section==='main';
  const step=(lbl,act,val)=>`<div class="field"><span>${lbl}</span><div class="ctl"><button data-act="${act}" data-i="${i}" data-d="-1" aria-label="Less">−</button><output>${val}</output><button data-act="${act}" data-i="${i}" data-d="1" aria-label="More">+</button></div></div>`;
  const ed=open?`<div class="editor">
    ${main?step('Sets','sets',it.sets):''}
    ${it.mode==='time'?step(it.side?'Seconds / side':'Seconds','work',it.work+' s'):`<div class="field"><span>Reps</span><input class="txt" id="reps-${it.uid}" data-reps="${i}" value="${it.reps}"></div>`}
    ${main?step('Rest','rest',it.rest+' s'):''}
    <div class="moves"><button class="icon" data-act="mv" data-i="${i}" data-d="-1" aria-label="Move up">${ico('up',18)}</button><button class="icon" data-act="mv" data-i="${i}" data-d="1" aria-label="Move down">${ico('down',18)}</button></div>
  </div>`:'';
  const meta=[dose(it),main&&it.rest?`${it.rest} s rest`:'',main?it.eq:''].filter(Boolean).join(' · ');
  return `<li class="row"><button class="row-main" data-act="toggle" data-i="${i}" aria-expanded="${open}"><span class="name">${it.name}</span><span class="meta">${meta}</span><span class="how ${open?'':'clamp'}">${howOf(it)}</span>${open?`<span class="how"><b>Tip:</b> ${it.cue}</span>`:''}</button>
  <div class="row-actions">${main?`<button class="icon" data-act="swap" data-i="${i}" aria-label="Swap ${it.name}">${ico('swap')}</button>`:''}<button class="icon" data-act="rm" data-i="${i}" aria-label="Remove ${it.name}">${ico('x')}</button></div>${ed}</li>`;
}

function current(){const its=S.W.items;for(let i=0;i<its.length;i++)for(let s=0;s<its[i].done.length;s++)if(!its[i].done[s])return {i,s};return null;}
function counts(){let d=0,t=0;S.W.items.forEach(it=>{t+=it.done.length;d+=it.done.filter(Boolean).length;});return {d,t};}
function target(it){const side=it.side?' each side':'';return it.mode==='time'?`${fmt(it.work)}${side}`:`${it.reps} reps${side}`;}

function vTrain(){
  const W=S.W,cur=current(),{d,t}=counts(),T=W.timer;
  let now;
  if(!cur){now=`<section class="now"><span class="eyebrow">Every set crossed off</span><h2 class="nname">Nice work</h2><button class="btn primary big" data-act="finish">Finish workout</button></section>`;}
  else{
    const it=W.items[cur.i],mainN=W.items.filter(x=>x.section==='main'),pos=mainN.indexOf(it);
    const where=it.section==='warm'?'Warm-up':it.section==='cool'?'Cool-down':`Exercise ${pos+1} of ${mainN.length}`;
    const working=T&&T.kind==='work';
    const btn=working?`<button class="btn primary big" disabled>Timer running</button>`:it.mode==='time'?`<button class="btn primary big" data-act="startwork">Start ${fmt(it.work*(it.side?2:1))} timer</button>`:`<button class="btn primary big" data-act="doneset">Set ${cur.s+1} done</button>`;
    const showWt=it.mode==='reps'&&it.eq!=='Bodyweight';
    now=`<section class="now">
      <span class="eyebrow">${where}</span>
      <h2 class="nname">${it.name}</h2>
      <p class="cue">${howOf(it)}</p>
      <p class="cue"><b>Tip:</b> ${it.cue}</p>
      <div class="target">Set ${cur.s+1} of ${it.done.length} · ${target(it)}</div>
      <div class="row2">${btn}${showWt?`<label class="wt">kg <input id="wt-${it.uid}" data-wt="${cur.i}" inputmode="decimal" value="${it.weight}" placeholder="—"></label>`:''}</div>
      <div class="row2"><button class="btn small ghost" data-act="skipex">Skip this exercise</button></div>
    </section>`;
  }
  const list=W.items.map((it,i)=>{
    const fin=it.done.every(Boolean),isCur=cur&&cur.i===i;
    const chips=it.done.map((v,s)=>`<button class="set ${v===true?'done':''} ${v==='skip'?'skip':''} ${isCur&&cur.s===s?'cur':''}" data-act="set" data-i="${i}" data-s="${s}" aria-pressed="${!!v}" aria-label="${it.name} set ${s+1}${v?' crossed off':''}">${it.mode==='time'?fmt(it.work):it.repsN}${it.side?'×2':''}</button>`).join('');
    return `<div class="ex ${fin?'fin':''} ${isCur?'cur':''}"><div class="ex-h"><span class="name">${it.name}</span><span class="meta">${it.section==='main'?(it.weight?it.weight+' kg · ':'')+(it.rest?it.rest+' s rest':''):it.section==='warm'?'Warm-up':'Cool-down'}</span></div><details class="howto"><summary>How to do it</summary><p>${howOf(it)}</p><p><b>Tip:</b> ${it.cue}</p></details><div class="setchips">${chips}</div></div>`;
  }).join('');
  return `<div class="topbar">
    <div><span class="clock-l">Elapsed</span><span class="clock" id="clock">${fmtLong(Date.now()-W.startedAt)}</span></div>
    <div class="prog"><small>${d} / ${t} sets</small><div class="track"><i style="width:${t?d/t*100:0}%"></i></div></div>
    <button class="icon" data-act="sound" aria-label="${S.sound?'Mute':'Unmute'} timer sounds">${ico(S.sound?'on':'off')}</button>
    <button class="btn small" data-act="finish" id="finBtn">Finish</button>
  </div>${now}<p class="explain" style="margin-bottom:10px">Tap a set to cross it off. The rest timer starts on its own, and timed sets count down for you. Tap a crossed-off set to undo it. <b>×2</b> on a set means do both sides.</p><div class="exlist">${list}</div>`;
}

function vSheet(){
  const T=S.W&&S.W.timer;if(!T)return '';
  const W=S.W;
  if(T.kind==='rest'){
    const nx=current(),it=nx&&W.items[nx.i];
    return `<div class="sheet" style="--tc:var(--p10)"><div class="sheet-in">
      <div class="sh-top"><span class="kind">Rest</span><span class="sh-next">${it?`Next: ${it.name} · set ${nx.s+1}`:''}</span></div>
      <div class="tbig" id="tBig">${fmt((T.endAt-Date.now())/1000)}</div>
      <div class="bar"><i id="tBar"></i></div>
      <div class="sh-btns"><button class="btn" data-act="adj" data-d="-15">−15 s</button><button class="btn" data-act="adj" data-d="15">+15 s</button><button class="btn primary" data-act="skiprest">Skip rest</button></div>
    </div></div>`;
  }

  </div></div>`;
}

function vDone(){
  const s=S.summary;if(!s)return '';
  return `<section class="done-h"><span class="eyebrow" style="opacity:1;color:var(--muted)">${new Date(s.t).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})}</span><h2 class="huge">Workout logged</h2><span class="hint">${s.muscles.map(m=>MNAME[m]).join(', ')} · ${INT[s.intensity].name}</span></section>

    <div class="stat"><b>${fmtLong(s.dur)}</b><span>Time</span></div>

  <div class="stack"><button class="btn primary big wide" data-act="repeat">Repeat this plan</button><button class="btn wide" data-act="go" data-to="setup">Plan a new workout</button></div>`;

function vDock(){
  if(S.screen==='setup')return `<div class="dock"><div class="dock-in"><button class="btn primary big" data-act="build">Build my plan</button></div></div>`;
  if(S.screen==='plan')return `<div class="dock"><div class="dock-in"><button class="btn big" data-act="go" data-to="setup">Back</button><button class="btn primary big" data-act="start">Accept and start</button></div></div>`;
  if(S.screen==='train')return vSheet();
  return '';
}

function render(){
  vSteps();
  const v={setup:vSetup,plan:vPlan,train:vTrain,done:vDone}[S.screen];

/* ---------- sound, vibration, wake lock ---------- */
let actx;
function unlock(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}}
function beep(f=880,d=.12,delay=0){if(!S.sound||!actx)return;try{const t=actx.currentTime+delay,o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+.03);}catch(e){}}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}
let wl=null;
async function wake(on){try{if(on&&!wl&&'wakeLock' in navigator){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null;});}if(!on&&wl){await wl.release();wl=null;}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.screen==='train')wake(true);});

/* ---------- workout engine ---------- */
function startWork(i,s){const it=S.W.items[i],total=it.work*(it.side?2:1);S.W.timer={kind:'work',i,s,total,endAt:Date.now()+total*1000,side:it.side,switched:false};beep(1046,.18);save();render();}
function afterSet(i){
  beep(660,.15);vib(120);
  const nx=current();
  if(!nx){S.W.timer=null;beep(784,.15,.18);beep(1046,.35,.36);save();render();return;}
  const rest=S.W.items[i].rest;
  if(rest>0){S.W.timer={kind:'rest',total:rest,endAt:Date.now()+rest*1000,from:i};save();render();}
  else autoNext(i);
}
function endRest(){const from=S.W.timer.from;S.W.timer=null;beep(988,.35);vib([80,60,80]);autoNext(from);}
function autoNext(from){
  const nx=current();
  if(nx){const it=S.W.items[nx.i];if(it.mode==='time'&&(it.section!=='main'||nx.i===from)){startWork(nx.i,nx.s);return;}}
  save();render();
}
function completeSet(i,s){if(S.W.timer)S.W.timer=null;S.W.items[i].done[s]=true;afterSet(i);}

let lastBeep=null;
function tick(force){
  if(S.screen!=='train'||!S.W)return;
  const c=$('#clock');if(c)c.textContent=fmtLong(Date.now()-S.W.startedAt);
  const T=S.W.timer;if(!T)return;
  const left=T.paused?T.left:T.endAt-Date.now();
  const big=$('#tBig'),bar=$('#tBar');
  if(big)big.textContent=fmt(left/1000);
  if(bar)bar.style.width=Math.max(0,Math.min(100,(1-left/(T.total*1000))*100))+'%';
  if(T.paused||force)return;
  const sec=Math.ceil(left/1000);
  if(sec<=3&&sec>=1&&lastBeep!==sec){lastBeep=sec;beep(880,.08);}
  if(T.kind==='work'&&T.side&&!T.switched&&left<=T.total*500){T.switched=true;beep(1320,.1);beep(1320,.1,.15);vib([60,40,60]);const sd=$('#tSide');if(sd)sd.textContent='Switch sides';save();}
  if(left<=0){lastBeep=null;if(T.kind==='work'){const {i,s}=T;S.W.timer=null;S.W.items[i].done[s]=true;afterSet(i);}else endRest();}
}
setInterval(()=>tick(false),250);

function finish(){
  const W=S.W,end=Date.now();let sets=0,planned=0,vol=0;
  const items=W.items.filter(it=>it.section==='main').map(it=>{const d=it.done.filter(x=>x===true).length;return {name:it.name,done:d,sets:it.done.length,weight:it.weight};});
  W.items.forEach(it=>{planned+=it.done.length;const d=it.done.filter(x=>x===true).length;sets+=d;const w=parseFloat(String(it.weight||'').replace(',','.'));if(w>0&&it.mode==='reps')vol+=w*(it.repsN||0)*d*(it.side?2:1);});
  const inp=S.plan?S.plan.input:S.input;
  S.summary={t:end,dur:end-W.startedAt,sets,planned,vol,exercises:items.filter(x=>x.done>0).length,items,muscles:inp.muscles,intensity:inp.intensity};
  S.history.unshift({t:end,min:Math.round((end-W.startedAt)/60000),sets,muscles:inp.muscles});S.history=S.history.slice(0,10);
  S.W=null;S.screen='done';wake(false);save();render();window.scrollTo(0,0);
}

/* ---------- events ---------- */
let finArm=0;
document.addEventListener('click',e=>{
  unlock();
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,i=+b.dataset.i,d=+b.dataset.d;
  const inp=S.input,P=S.plan;
  const tog=(arr,k)=>arr.includes(k)?arr.filter(x=>x!==k):[...arr,k];
  switch(a){
    case 'go':S.screen=b.dataset.to;S.open=null;break;
    case 'eq':inp.equip=tog(inp.equip,b.dataset.k);break;
    case 'mu':inp.muscles=tog(inp.muscles,b.dataset.k);break;
    case 'fullbody':inp.muscles=FULL.slice();break;
    case 'int':inp.intensity=+b.dataset.n;break;
    case 'warm':inp.warm=b.checked;save();return;
    case 'cool':inp.cool=b.checked;save();return;
    case 'build':if(!inp.muscles.length){toast('Pick at least one muscle group to train.');return;}S.plan=generate(inp);S.screen='plan';S.open=null;window.scrollTo(0,0);break;
    case 'regen':S.plan=generate(P.input);S.open=null;toast('New plan built');break;
    case 'toggle':{const u=P.items[i].uid;S.open=S.open===u?null:u;break;}
    case 'rm':{const it=P.items.splice(i,1)[0];toast(`Removed ${it.name}`);break;}
    case 'swap':{
      const it=P.items[i],av=availFor(P.input.equip),inPlan=new Set(P.items.map(x=>x.id));
      let c=av.filter(x=>!inPlan.has(x.e.id)&&x.e.m[0]===it.m[0]);
      if(!c.length)c=av.filter(x=>!inPlan.has(x.e.id)&&x.e.m.includes(it.m[0]));
      if(!c.length){toast('No other option fits your equipment.');return;}
      const x=c[Math.floor(Math.random()*c.length)];const n=makeItem(x.e,x.alt,INT[P.input.intensity]);
      P.items[i]=n;if(S.open===it.uid)S.open=n.uid;toast(`Swapped in ${n.name}`);break;}
    case 'add':{
      const id=$('#addSel').value,av=availFor(P.input.equip),x=av.find(x=>x.e.id===id);if(!x)return;
      const n=makeItem(x.e,x.alt,INT[P.input.intensity]);const ci=P.items.findIndex(it=>it.section==='cool');
      P.items.splice(ci<0?P.items.length:ci,0,n);S.open=n.uid;toast(`Added ${n.name}`);break;}
    case 'sets':P.items[i].sets=Math.max(1,Math.min(8,P.items[i].sets+d));break;
    case 'work':P.items[i].work=Math.max(10,Math.min(600,P.items[i].work+d*5));break;
    case 'rest':P.items[i].rest=Math.max(0,Math.min(300,P.items[i].rest+d*15));break;
    case 'mv':{const j=i+d,its=P.items;if(j<0||j>=its.length||its[j].section!==its[i].section)return;[its[i],its[j]]=[its[j],its[i]];break;}
    case 'start':
      if(!P.items.length){toast('Add at least one exercise first.');return;}
      S.W={items:P.items.map(it=>({...it,done:Array(it.section==='main'?it.sets:1).fill(false),weight:''})),startedAt:Date.now(),timer:null};
      S.screen='train';wake(true);window.scrollTo(0,0);break;
    case 'doneset':{const c=current();if(c)completeSet(c.i,c.s);return;}
    case 'startwork':{const c=current();if(c)startWork(c.i,c.s);return;}
    case 'set':{
      const s=+b.dataset.s,it=S.W.items[i];
      if(it.done[s]){it.done[s]=false;break;}
      if(S.W.timer&&S.W.timer.kind==='work'&&S.W.timer.i===i&&S.W.timer.s===s)S.W.timer=null;
      completeSet(i,s);return;}
    case 'skipex':{const c=current();if(!c)return;const it=S.W.items[c.i];it.done=it.done.map(v=>v||'skip');S.W.timer=null;toast(`Skipped ${it.name}`);break;}
    case 'skiprest':endRest();return;
    case 'adj':{const T=S.W.timer;T.endAt=Math.max(Date.now()+1000,T.endAt+d*1000);T.total=Math.max(T.total,(T.endAt-Date.now())/1000);break;}
    case 'pause':{const T=S.W.timer;if(T.paused){T.endAt=Date.now()+T.left;T.paused=false;}else{T.left=T.endAt-Date.now();T.paused=true;}break;}
    case 'earlydone':{const T=S.W.timer;completeSet(T.i,T.s);return;}
    case 'cancelwork':S.W.timer=null;break;
    case 'sound':S.sound=!S.sound;if(S.sound)beep(880,.08);break;
    case 'finish':{
      const {d,t}=counts();
      if(d<t&&Date.now()-finArm>3000){finArm=Date.now();b.textContent='Tap to confirm';setTimeout(()=>{const f=$('#finBtn');if(f)f.textContent='Finish';},3000);return;}
      finish();return;}
    case 'repeat':S.screen='plan';break;
  }
  save();render();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='minutes'){S.input.minutes=+t.value;$('#minOut').textContent=t.value;save();}
  if(t.dataset.wt!==undefined){S.W.items[+t.dataset.wt].weight=t.value;save();}
  if(t.dataset.reps!==undefined){const it=S.plan.items[+t.dataset.reps];it.reps=t.value;it.repsN=parseReps(t.value);save();}
});
document.addEventListener('change',e=>{if(e.target.dataset.reps!==undefined)render();});

if(S.screen==='train'&&!S.W)S.screen='setup';
if(S.screen==='plan'&&!S.plan)S.screen='setup';
if(S.screen==='done'&&!S.summary)S.screen='setup';
if(S.screen==='train')wake(true);
render();
</script>
</body>
